<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Achref Ferjani — DevOps, DevSecOps, Software Engineering">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#04060d"/>
    <stop offset="0.6" stop-color="#0a0f2b"/>
    <stop offset="1" stop-color="#1b1245"/>
  </linearGradient>
  <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8ab4ff" stop-opacity="0"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
  </linearGradient>
  <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#6c7bff" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#6c7bff" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .tw{fill:#fff;animation:twinkle 4s ease-in-out infinite}
  .t1{animation-duration:3s} .t2{animation-duration:5s} .t3{animation-duration:7s}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
  .shoot{opacity:0;animation-name:fly;animation-timing-function:cubic-bezier(.3,.1,.6,1);animation-iteration-count:infinite}
  @keyframes fly{
    0%{opacity:0;transform:translateX(0)}
    2%{opacity:1}
    12%{opacity:1;transform:translateX(720px)}
    14%{opacity:0;transform:translateX(760px)}
    100%{opacity:0;transform:translateX(760px)}
  }
  .name{font:700 46px 'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#fff;letter-spacing:1px}
  .tag{font:400 20px 'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#a9b8ff;letter-spacing:3px}
  @media (prefers-reduced-motion:reduce){.tw,.shoot{animation:none} .tw{opacity:.7}}
</style>
